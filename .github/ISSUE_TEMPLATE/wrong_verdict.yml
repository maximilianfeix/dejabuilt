name: Wrong verdict
description: The verdict for an idea looks wrong
labels: [verdict]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: One sentence, as you gave it.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report
      description: Paste the Markdown report, including the evidence section.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the verdict should have been, and why
      description: For example a repository that was missed, or one that was marked wrongly.
    validations:
      required: true
