name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version
        run: |
          version="$(python -c 'import json; print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}" >&2
            exit 1
          fi

      - name: Build the skill archive
        run: |
          cd plugin/skills
          zip -r "../../dejabuilt-${GITHUB_REF_NAME}.zip" dejabuilt -x '*/__pycache__/*' '*.pyc'
          cd ../..
          sha256sum "dejabuilt-${GITHUB_REF_NAME}.zip" > SHA256SUMS

      - name: Check that the archive runs on its own
        run: |
          mkdir /tmp/unpacked
          unzip -q "dejabuilt-${GITHUB_REF_NAME}.zip" -d /tmp/unpacked
          cd /tmp
          python unpacked/dejabuilt/scripts/run.py --version

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dejabuilt-${GITHUB_REF_NAME}.zip" SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)." \
            --verify-tag
