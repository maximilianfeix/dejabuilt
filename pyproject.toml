[project]
name = "dejabuilt"
version = "0.2.1"
description = "An agent skill that checks GitHub before you build."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["plugin/skills/dejabuilt/scripts"]
testpaths = ["tests"]
addopts = "--strict-markers --cov=dejabuilt --cov-report=term-missing --cov-fail-under=90"
markers = ["live: talks to the real GitHub API; needs DEJABUILT_LIVE=1"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["plugin/skills/dejabuilt/scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF", "S", "N"]
ignore = [
    "S310", # URLs are built from a fixed https base; see github.py
    "S603", # the credential helper is called with an argument list, no shell
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "plugin/skills/dejabuilt/scripts"
files = ["plugin/skills/dejabuilt/scripts", "tests", "tools"]
explicit_package_bases = true
